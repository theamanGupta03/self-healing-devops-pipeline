name: 🚀 Self-Healing CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theamangupta03/self-healing-app

jobs:
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint
        run: flake8 app/ --max-line-length=100 --ignore=E501,W503

      - name: Test
        run: pytest tests/ -v --cov=app --cov-report=xml


  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  health-check:
    name: 🩺 Health Check & Self-Healing
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run -d \
            --name self-healing-app \
            -p 5000:5000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Wait for app
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ App is up!"
              break
            fi
            echo "Attempt $i..."
            if [ $i -eq 15 ]; then
              docker logs self-healing-app
              exit 1
            fi
            sleep 3
          done

      - name: Cleanup
        if: always()
        run: |
          docker stop self-healing-app || true
          docker rm self-healing-app || true


  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: health-check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔐 Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > key.b64
          base64 --decode key.b64 > ~/.ssh/ec2_key.pem

          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🧪 Test SSH
        run: |
          ssh -o ConnectTimeout=10 -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "echo SSH OK"

      - name: 💾 Save last running image
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          if docker ps --format '{{.Image}}' | grep self-healing-app > /dev/null; then
            docker ps --format '{{.Image}}' | grep self-healing-app | head -n1 | awk -F ':' '{print $2}' > ~/last_good_image.txt
          else
            echo "latest" > ~/last_good_image.txt
          fi
          EOF

      - name: 🚀 Deploy with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."

            ssh -o ConnectTimeout=10 -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} \
            "cd ~/self-healing-devops-pipeline && \
             git pull origin main && \
             docker-compose down && \
             docker-compose pull && \
             docker-compose up -d" && break

            echo "❌ Attempt $i failed"
            sleep 5
          done

      - name: 🩺 Verify deployment
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -sf http://${{ secrets.EC2_HOST }}:5000/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','FAIL'))" 2>/dev/null || echo "FAIL")
            echo "Check $i: $STATUS"
            if [ "$STATUS" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: 🔙 Rollback
        if: failure()
        run: |
          LAST_GOOD=$(ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "cat ~/last_good_image.txt 2>/dev/null || echo latest")
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} << EOF
          docker pull ghcr.io/theamangupta03/self-healing-app:$LAST_GOOD
          docker stop self-healing-app || true
          docker rm self-healing-app || true
          docker run -d -p 5000:5000 --name self-healing-app ghcr.io/theamangupta03/self-healing-app:$LAST_GOOD
          EOF


  notify:
    name: 📣 Slack Notification
    runs-on: ubuntu-latest
    needs: [test, build, health-check, deploy]
    if: always()

    steps:
      - name: Notify Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"🚨 Pipeline Failed!"}'

      - name: Notify Success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ Pipeline Successful!"}'