name: 🚀 Self-Healing CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theamangupta03/self-healing-app

jobs:
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov flake8
      - name: Lint
        run: flake8 app/ --max-line-length=100 --ignore=E501,W503
      - name: Test
        run: pytest tests/ -v --cov=app --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    name: 🩺 Health Check & Self-Healing
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run container
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run -d \
            --name self-healing-app \
            -p 5000:5000 \
            -e APP_VERSION=${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ App is up!"
              break
            fi
            echo "Attempt $i/15 — waiting..."
            [ $i -eq 15 ] && docker logs self-healing-app && exit 1
            sleep 3
          done
      - name: Run health checks
        id: healthcheck
        run: |
          chmod +x scripts/health_check.sh
          ./scripts/health_check.sh
      - name: 🔄 Self-Healing
        if: failure() && steps.healthcheck.conclusion == 'failure'
        id: selfhealing
        run: |
          echo "🔄 Restarting container..."
          docker restart self-healing-app
          sleep 10
          ./scripts/health_check.sh && echo "✅ Recovered!" || exit 1
      - name: Notify Slack on Self-Healing Recovery
        if: steps.selfhealing.conclusion == 'success'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "♻️ *Self-Healing Succeeded — App Recovered!*",
            "attachments": [{
              "color": "#36a64f",
              "fields": [
                {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                {"title": "Action Taken", "value": "App failed initial health check but recovered automatically after container restart.", "short": false},
                {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
              ]
            }]
          }'
      - name: Container logs
        if: always()
        run: docker logs self-healing-app || true
      - name: Cleanup
        if: always()
        run: |
          docker stop self-healing-app || true
          docker rm self-healing-app || true

  notify:
    name: 📣 Slack Notification
    runs-on: ubuntu-latest
    needs: [test, build, health-check]
    if: always()
    steps:

      # ✅ Full Pipeline Success
      - name: Notify Success
        if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && needs.health-check.result == 'success' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "✅ *Pipeline PASSED*",
            "attachments": [{
              "color": "#36a64f",
              "fields": [
                {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
              ]
            }]
          }'

      # ❌ Tests / Lint Failed
      - name: Notify Test Failure
        if: ${{ needs.test.result == 'failure' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "❌ *Tests Failed — Pipeline Stopped*",
            "attachments": [{
              "color": "#ff0000",
              "fields": [
                {"title": "Failed Job", "value": "🧪 Lint & Test", "short": true},
                {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                {"title": "Reason", "value": "Lint or pytest checks failed. Check logs for details.", "short": false},
                {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
              ]
            }]
          }'

      # 🐳 Docker Build / Push Failed
      - name: Notify Build Failure
        if: ${{ needs.test.result == 'success' && needs.build.result == 'failure' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "🐳 *Docker Build/Push Failed*",
            "attachments": [{
              "color": "#ff6600",
              "fields": [
                {"title": "Failed Job", "value": "🐳 Build & Push Image", "short": true},
                {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                {"title": "Reason", "value": "Docker image build or push to GHCR failed.", "short": false},
                {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
              ]
            }]
          }'

      # 🚨 Self-Healing Failed — needs manual fix
      - name: Notify Self-Healing Failure
        if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && needs.health-check.result == 'failure' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "🚨 *Self-Healing Failed — Manual Intervention Required!*",
            "attachments": [{
              "color": "#8b0000",
              "fields": [
                {"title": "Failed Job", "value": "🩺 Health Check & Self-Healing", "short": true},
                {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                {"title": "Reason", "value": "App failed health checks and could not auto-recover after container restart. Manual fix needed.", "short": false},
                {"title": "Run", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
              ]
            }]
          }'